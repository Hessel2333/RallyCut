name: Release desktop app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - id: release
        run: node scripts/check-release.mjs
      - name: Install native FFmpeg
        run: |
          choco install ffmpeg --yes --no-progress
          $binary = (Get-Command ffmpeg.exe -ErrorAction Stop).Source
          "RALLYCUT_FFMPEG_DIR=$(Split-Path $binary)" >> $env:GITHUB_ENV
          ffmpeg -version
          ffprobe -version
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm test
      - run: node --test scripts/finalize-update.test.mjs
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test export_integration -- --ignored
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: RallyCut v__VERSION__
          releaseBody: ${{ steps.release.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis -- --locked
          updaterJsonPreferNsis: true
      - name: Use public updater downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: node scripts/finalize-update.mjs
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: node scripts/check-release.mjs
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Apple Silicon app and DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg -- --locked
      - name: Verify and archive app
        run: |
          APP=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/RallyCut.app
          /usr/bin/codesign --verify --deep --strict "$APP"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist"
          mkdir -p release-artifacts
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          # Preserve the exact archive bytes covered by Tauri's updater signature.
          cp "${APP}.tar.gz" "release-artifacts/RallyCut_${VERSION}_aarch64.app.tar.gz"
          cp "${APP}.tar.gz.sig" "release-artifacts/RallyCut_${VERSION}_aarch64.app.tar.gz.sig"
          test -s "release-artifacts/RallyCut_${VERSION}_aarch64.app.tar.gz.sig"
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release-artifacts/
          cd release-artifacts
          shasum -a 256 *.dmg *.tar.gz > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-apple-silicon
          path: release-artifacts/*
          if-no-files-found: error
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: macos-apple-silicon
          path: release-artifacts
      - name: Upload macOS downloads and publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.windows.outputs.release_id }}
        run: |
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .tag_name)
          gh release upload "$TAG" release-artifacts/* --clobber
          MACOS_UPDATE_DIR=release-artifacts node scripts/finalize-update.mjs
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
