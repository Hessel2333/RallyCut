name: Release Windows app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - id: release
        run: node scripts/check-release.mjs
      - name: Install native FFmpeg
        run: |
          choco install ffmpeg --yes --no-progress
          $binary = (Get-Command ffmpeg.exe -ErrorAction Stop).Source
          "RALLYCUT_FFMPEG_DIR=$(Split-Path $binary)" >> $env:GITHUB_ENV
          ffmpeg -version
          ffprobe -version
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm test
      - run: node --test scripts/finalize-update.test.mjs
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test export_integration -- --ignored
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: RallyCut v__VERSION__
          releaseBody: ${{ steps.release.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis -- --locked
          updaterJsonPreferNsis: true
      - name: Use public updater downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: node scripts/finalize-update.mjs
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -F draft=false
